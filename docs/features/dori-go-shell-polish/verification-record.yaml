    requirement_id: dori-go.shell.splash-screen
    status: done
    outcome: passed
    version: v1
    priority: low
    criterion: >
      A branded splash screen shows during app initialization instead of a
      blank/white window.
    evidence:
      test: test/shell-polish.mjs
      fingerprint: c1523a3fd6af8232fbd6bd7326fd3edeb8291200bbd5df79e52b8f3480eb3b1e
      run: node test/shell-polish.mjs
    note: >
      index.html initial branded splash shell + ready-to-show handler in main.js, verified in test/shell-polish.mjs.
  - id: verify.dori-go.shell.native-motion
    requirement_id: dori-go.shell.native-motion
    status: done
    outcome: passed
    version: v1
    priority: medium
    criterion: >
      Sidebar switches, slideover open/close, and search modal open/close
