      fingerprint: c1523a3fd6af8232fbd6bd7326fd3edeb8291200bbd5df79e52b8f3480eb3b1e
      run: node test/shell-polish.mjs
    note: >
      motion.js shared constants and anim-rise screen transition in App.jsx, verified in test/shell-polish.mjs.
  - id: verify.dori-go.shell.design-consistency
    requirement_id: dori-go.shell.design-consistency
    status: done
    outcome: passed
    version: v1
    priority: medium
    criterion: >
      Existing and new-v1 screens read as one design system, matching
      tokens.css and real Dori's spacing/type/color conventions.
    evidence:
      test: test/shell-polish.mjs
      fingerprint: c1523a3fd6af8232fbd6bd7326fd3edeb8291200bbd5df79e52b8f3480eb3b1e
      run: node test/shell-polish.mjs
    note: >
      2026-08-31: test/shell-polish.mjs now actually greps each of the 8
