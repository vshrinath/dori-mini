<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dori Go</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      font-family: -apple-system, 'Figtree', BlinkMacSystemFont, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0e0f13;
      }
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }
    .splash-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(26, 31, 78, 0.12);
      animation: splash-pulse 1.8s ease-in-out infinite;
    }
    .splash-text {
      margin-top: 16px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #1a1f4e;
    }
    @media (prefers-color-scheme: dark) {
      .splash-logo {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .splash-text {
        color: #f3f4f6;
      }
    }
    @keyframes splash-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(0.96);
        opacity: 0.75;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="splash-container">
      <img src="./assets/icon.png" alt="Dori" class="splash-logo" />
      <div class="splash-text">Dori</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
