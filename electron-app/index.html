<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dori</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <style>
    @font-face {
      font-family: 'Figtree';
      src: url('/fonts/figtree-latin-variable.woff2') format('woff2');
      font-weight: 300 900;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: #fafaf8;
      font-family: 'Figtree', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 15px;
      line-height: 1.5;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0e0f13;
      }
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }
    .splash-card video {
      display: block;
      width: 190px;
      height: auto;
    }
    /* Light mode: bare wordmark on the canvas. Dark mode: the navy wordmark
       needs a white card behind it until a dark-variant video is wired in. */
    @media (prefers-color-scheme: dark) {
      .splash-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 22px 30px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="splash-container">
      <div class="splash-card">
        <video src="./assets/dori-wordmark.webm" autoplay muted playsinline></video>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
