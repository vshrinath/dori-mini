<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dori Quick Capture</title>
<link rel="icon" type="image/png" href="./assets/icon.png">
<style>
  :root {
    --bg: rgba(255, 255, 255, 0.88);
    --border: rgba(15, 23, 42, 0.12);
    --shadow: 0 24px 64px -8px rgba(18, 20, 32, 0.18), 0 6px 18px rgba(18, 20, 32, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --text: #1d1e22;
    --muted: rgba(29, 30, 34, 0.5);
    --accent: #1a1f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: rgba(24, 25, 30, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 24px 64px -8px rgba(0, 0, 0, 0.55), 0 6px 18px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: rgba(243, 244, 246, 0.5);
      --accent: #4c5ab0;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, 'Figtree', BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10px;
    user-select: none;
  }
  .capsule {
    position: relative;
    width: 420px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(1.8);
    -webkit-backdrop-filter: blur(28px) saturate(1.8);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 20px;
    padding: 12px 12px 12px 16px;
    -webkit-app-region: no-drag;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .capsule.drag-over {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--bg));
  }
  .drag-handle {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 12px;
    -webkit-app-region: drag;
    cursor: grab;
  }
  .drag-handle::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    border-radius: 99px;
    background: var(--border);
    opacity: 0.8;
  }
  textarea {
    flex: 1;
    min-height: 22px;
    max-height: 64px;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
    line-height: 1.4;
    outline: none;
    resize: none;
    padding: 2px 0;
    -webkit-app-region: no-drag;
  }
  textarea::placeholder { color: var(--muted); }
  button {
    -webkit-app-region: no-drag;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 120ms, opacity 120ms;
  }
  button:active { transform: scale(0.95); }
  button:disabled { opacity: 0.35; cursor: default; }
  .status {
    position: absolute;
    top: -20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 120ms;
    pointer-events: none;
  }
  .status.show { opacity: 1; }
  .status.ok { color: #22c55e; }
  .status.error { color: #ef4444; }
</style>
</head>
<body>
  <div class="capsule" id="capsule">
    <div class="drag-handle" title="Drag to move"></div>
    <div class="status" id="status"></div>
    <textarea id="input" rows="1" placeholder="Capture a thought, or drop a file…" autofocus></textarea>
    <button id="send" title="Save (Enter)" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </div>
  <script>
    const capsule = document.getElementById('capsule');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');

    function autoGrow() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(64, input.scrollHeight)}px`;
      sendBtn.disabled = !input.value.trim();
    }
    input.addEventListener('input', autoGrow);

    function showStatus(text, kind) {
      status.textContent = text;
      status.className = `status show ${kind}`;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      try {
        await window.dori.call('capture_text', { text });
        input.value = '';
        autoGrow();
        window.dori.closeMini();
      } catch (err) {
        sendBtn.disabled = false;
        console.error('capture failed', err);
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      } else if (e.key === 'Escape') {
        window.dori.closeMini();
      }
    });
    sendBtn.addEventListener('click', send);
    window.addEventListener('focus', () => input.focus());

    capsule.addEventListener('dragover', (e) => {
      e.preventDefault();
      capsule.classList.add('drag-over');
    });
    capsule.addEventListener('dragleave', () => {
      capsule.classList.remove('drag-over');
    });
    capsule.addEventListener('drop', async (e) => {
      e.preventDefault();
      capsule.classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files || []);
      if (files.length === 0) return;
      try {
        for (const file of files) {
          const sourcePath = window.dori.getFilePath(file);
          await window.dori.call('capture_file', { sourcePath });
        }
        showStatus(files.length === 1 ? 'Saved ✓' : `Saved ${files.length} files ✓`, 'ok');
        setTimeout(() => window.dori.closeMini(), 500);
      } catch (err) {
        console.error('file capture failed', err);
        showStatus('Failed to save', 'error');
      }
    });
  </script>
</body>
</html>
